<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title description">
  <title id="title">Jacky Lephoto — Full-stack Software Developer</title>
  <desc id="description">A navy, violet and blue banner with the name Jacky Lephoto, the words Thoughtful interfaces. Reliable systems., and a decorative code window.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080d20"/><stop offset="1" stop-color="#10152e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#bb92ff"/><stop offset="1" stop-color="#6385ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#6941d3" stop-opacity=".35"/><stop offset="1" stop-color="#6941d3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1c1c3c"/><stop offset="1" stop-color="#10172d"/>
    </linearGradient>
    <clipPath id="bounds"><rect x="1" y="1" width="1198" height="348" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="350" fill="url(#background)"/>
    <ellipse cx="1010" cy="165" rx="430" ry="340" fill="url(#glow)"/>
    <circle cx="1075" cy="180" r="245" fill="none" stroke="#7952c2" stroke-opacity=".22"/>
    <circle cx="1075" cy="180" r="212" fill="none" stroke="#7952c2" stroke-opacity=".13"/>
    <path d="M0 312H520L552 280H700" fill="none" stroke="#38335e" stroke-width="1"/>
    <circle cx="700" cy="280" r="3" fill="#9168ff"/>
    <path d="M73 70H112" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text x="73" y="106" fill="#bba1ed" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3.5">FULL-STACK SOFTWARE DEVELOPER</text>
    <text x="69" y="185" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.5">Jacky Lephoto<tspan fill="#c0a3ff">.</tspan></text>
    <text x="73" y="225" fill="#d8dcec" font-family="Arial, Helvetica, sans-serif" font-size="22">Thoughtful interfaces. Reliable systems.</text>
    <circle cx="78" cy="275" r="4" fill="#77dbb0"/>
    <text x="93" y="280" fill="#99a3bd" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.4">PRETORIA, SOUTH AFRICA</text>
    <g transform="translate(794 76)">
      <rect width="329" height="204" rx="14" fill="url(#window)" stroke="#514473"/>
      <path d="M1 40H328" stroke="#3b3457"/>
      <circle cx="21" cy="21" r="4" fill="#af79ed"/><circle cx="36" cy="21" r="4" fill="#6c7bda"/><circle cx="51" cy="21" r="4" fill="#688eac"/>
      <text x="307" y="25" text-anchor="end" fill="#8e85a6" font-family="monospace" font-size="10">hello.js</text>
      <g font-family="monospace" font-size="14">
        <text x="23" y="75" fill="#b89bff">const <tspan fill="#e0dfef">developer</tspan> = {</text>
        <text x="38" y="103" fill="#a7b3d5">name: <tspan fill="#90d4be">"Jacky"</tspan>,</text>
        <text x="38" y="131" fill="#a7b3d5">focus: <tspan fill="#90d4be">"Web &amp; mobile"</tspan>,</text>
        <text x="38" y="159" fill="#a7b3d5">craft: <tspan fill="#90d4be">"Idea to launch"</tspan></text>
        <text x="23" y="185" fill="#b89bff">};<tspan fill="#a68ce8"> ▌</tspan></text>
      </g>
    </g>
    <path d="M1165 44v14m-7-7h14" stroke="#a88de2" stroke-width="1.5"/>
    <path d="M747 109v12m-6-6h12" stroke="#8172bb"/>
    <circle cx="1141" cy="305" r="3" fill="#5f7fe4"/>
  </g>
  <rect x="1" y="1" width="1198" height="348" rx="22" fill="none" stroke="#2a2848"/>
</svg>
